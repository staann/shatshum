<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shatshum - O Chat Shumbrega | UnB</title>
    <style>
        body {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #1e3c72 100%);
            background-size: 400% 400%;
            animation: gradientShift 8s ease infinite;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .chat-container {
            width: 90%;
            max-width: 800px;
            height: 600px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: slideInUp 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
        }

        @keyframes slideInUp {
            0% {
                transform: translateY(100px) scale(0.9);
                opacity: 0;
            }
            100% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        .chat-header {
            background: linear-gradient(135deg, #00a86b 0%, #00c851 100%);
            color: white;
            padding: 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .chat-header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        .chat-header h1 {
            margin: 0;
            font-size: 1.8rem;
            font-weight: 600;
            animation: titlePulse 2s ease-in-out infinite alternate;
            position: relative;
            z-index: 1;
        }

        @keyframes titlePulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.02); }
        }

        .chat-header p {
            margin: 5px 0 0 0;
            opacity: 0.9;
            font-size: 0.9rem;
            position: relative;
            z-index: 1;
            animation: fadeInSlide 1s ease-out 0.5s both;
        }

        @keyframes fadeInSlide {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }
            100% {
                opacity: 0.9;
                transform: translateY(0);
            }
        }

        .unb-logo {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 40px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #00a86b;
            font-size: 0.8rem;
            z-index: 2;
            animation: logoSpin 4s linear infinite, logoBounce 2s ease-in-out infinite alternate;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        @keyframes logoSpin {
            0% { transform: translateY(-50%) rotate(0deg); }
            100% { transform: translateY(-50%) rotate(360deg); }
        }

        @keyframes logoBounce {
            0% { box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); }
            100% { box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2); }
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
            animation: messageSlideIn 0.5s ease-out;
        }

        @keyframes messageSlideIn {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.4;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .message-bubble:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        .message.bot .message-bubble {
            background: white;
            color: #333;
            border: 1px solid #e9ecef;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .message.bot .message-bubble::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 168, 107, 0.1), transparent);
            animation: messageShimmer 2s infinite;
        }

        @keyframes messageShimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, #00a86b 0%, #00c851 100%);
            color: white;
            animation: userMessageGlow 0.5s ease-out;
        }

        @keyframes userMessageGlow {
            0% {
                box-shadow: 0 0 0 rgba(0, 168, 107, 0.5);
            }
            50% {
                box-shadow: 0 0 20px rgba(0, 168, 107, 0.5);
            }
            100% {
                box-shadow: 0 0 0 rgba(0, 168, 107, 0.5);
            }
        }

        .bot-avatar {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #00a86b 0%, #00c851 100%);
            border-radius: 50%;
            margin-right: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 0.8rem;
            flex-shrink: 0;
            animation: avatarPulse 2s ease-in-out infinite, avatarFloat 3s ease-in-out infinite;
            box-shadow: 0 4px 15px rgba(0, 168, 107, 0.3);
            position: relative;
        }

        @keyframes avatarPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes avatarFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-3px); }
        }

        .bot-avatar::after {
            content: '';
            position: absolute;
            top: -2px;
            right: -2px;
            width: 8px;
            height: 8px;
            background: #00c851;
            border-radius: 50%;
            animation: statusBlink 1.5s ease-in-out infinite;
        }

        @keyframes statusBlink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        .welcome-message {
            text-align: center;
            padding: 40px 20px;
            color: #6c757d;
        }

        .welcome-message h3 {
            color: #00a86b;
            margin-bottom: 10px;
        }

        .quick-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
            justify-content: center;
        }

        .quick-action {
            background: white;
            border: 2px solid #00a86b;
            color: #00a86b;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            overflow: hidden;
            animation: quickActionFloat 2s ease-in-out infinite;
        }

        @keyframes quickActionFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-2px); }
        }

        .quick-action::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 168, 107, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .quick-action:hover::before {
            left: 100%;
        }

        .quick-action:hover {
            background: linear-gradient(135deg, #00a86b 0%, #00c851 100%);
            color: white;
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 8px 25px rgba(0, 168, 107, 0.3);
            border-color: #00c851;
        }

        .quick-action:active {
            transform: translateY(-2px) scale(1.02);
            transition: all 0.1s ease;
        }

        .chat-input {
            padding: 20px;
            background: white;
            border-top: 1px solid #e9ecef;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-field {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e9ecef;
            border-radius: 25px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            background: white;
        }

        .input-field:focus {
            border-color: #00a86b;
            box-shadow: 0 0 0 3px rgba(0, 168, 107, 0.1);
            transform: translateY(-1px);
        }

        .input-field:hover {
            border-color: #00c851;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .send-button {
            background: linear-gradient(135deg, #00a86b 0%, #00c851 100%);
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            font-size: 1.2rem;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 168, 107, 0.3);
        }

        .send-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transition: all 0.3s ease;
            transform: translate(-50%, -50%);
        }

        .send-button:hover::before {
            width: 100%;
            height: 100%;
        }

        .send-button:hover {
            background: linear-gradient(135deg, #00954f 0%, #00a86b 100%);
            transform: scale(1.1) rotate(15deg);
            box-shadow: 0 8px 25px rgba(0, 168, 107, 0.4);
        }

        .send-button:active {
            transform: scale(1.05) rotate(10deg);
            transition: all 0.1s ease;
        }

        .send-button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .send-button:disabled::before {
            display: none;
        }

        .typing-indicator {
            display: none;
            align-items: center;
            margin-bottom: 15px;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
            margin-left: 42px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: #00a86b;
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.4;
            }
            30% {
                transform: translateY(-10px);
                opacity: 1;
            }
        }

        .floating-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        .particle:nth-child(1) {
            width: 20px;
            height: 20px;
            top: 20%;
            left: 10%;
            animation-delay: 0s;
            animation-duration: 8s;
        }

        .particle:nth-child(2) {
            width: 15px;
            height: 15px;
            top: 60%;
            left: 80%;
            animation-delay: 2s;
            animation-duration: 6s;
        }

        .particle:nth-child(3) {
            width: 25px;
            height: 25px;
            top: 40%;
            left: 70%;
            animation-delay: 4s;
            animation-duration: 10s;
        }

        .particle:nth-child(4) {
            width: 12px;
            height: 12px;
            top: 80%;
            left: 20%;
            animation-delay: 1s;
            animation-duration: 7s;
        }

        .particle:nth-child(5) {
            width: 18px;
            height: 18px;
            top: 30%;
            left: 90%;
            animation-delay: 3s;
            animation-duration: 9s;
        }

        .particle:nth-child(6) {
            width: 22px;
            height: 22px;
            top: 70%;
            left: 5%;
            animation-delay: 5s;
            animation-duration: 8s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
                opacity: 0.3;
            }
            25% {
                transform: translateY(-20px) rotate(90deg);
                opacity: 0.6;
            }
            50% {
                transform: translateY(-40px) rotate(180deg);
                opacity: 0.8;
            }
            75% {
                transform: translateY(-20px) rotate(270deg);
                opacity: 0.6;
            }
        }

        @media (max-width: 768px) {
            .chat-container {
                width: 95%;
                height: 90vh;
                margin: 20px 0;
            }

            .chat-header h1 {
                font-size: 1.5rem;
            }

            .unb-logo {
                width: 35px;
                height: 35px;
                font-size: 0.7rem;
            }

            .message-bubble {
                max-width: 85%;
            }

            .quick-actions {
                flex-direction: column;
                align-items: center;
            }

            .quick-action {
                width: 200px;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <!-- Partículas flutuantes -->
    <div class="floating-particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="chat-container">
        <div class="chat-header">
            <h1>Shatshum</h1>
            <p>O Chat Shumbrega da UnB</p>
            <div class="unb-logo">UnB</div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="welcome-message">
                <h3>🎓 Bem-vindo ao Shatshum!</h3>
                <p>Olá! Sou o ShatShum - O Shat Shumbrega.<br>
                Oque conversaremos hoje?</p>
                
                <!-- ======================================== -->
                <!-- BOTÕES DE AÇÃO RÁPIDA - TAMBÉM USAM MARKOV -->
                <!-- ======================================== -->
                <!-- Estes botões chamam sendQuickMessage() que também usa o algoritmo de Markov -->
                <div class="quick-actions">
                    <div class="quick-action" onclick="sendQuickMessage('Conte-me sobre a UnB')">Sobre a UnB</div>
                    <div class="quick-action" onclick="sendQuickMessage('Quais cursos existem?')">Cursos</div>
                    <div class="quick-action" onclick="sendQuickMessage('Como me matricular?')">Matrícula</div>
                    <div class="quick-action" onclick="sendQuickMessage('Calendário acadêmico')">Calendário</div>
                </div>
            </div>

            <div class="typing-indicator" id="typingIndicator">
                <div class="bot-avatar">S</div>
                <div class="typing-dots">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            </div>
        </div>

        <!-- ======================================== -->
        <!-- FORMULÁRIO DE ENTRADA - INTEGRAÇÃO COM MARKOV -->
        <!-- ======================================== -->
        <!-- Este formulário chama sendMessage() que por sua vez usa getBotResponse() -->
        <!-- que é onde o algoritmo de Markov é executado -->
        <form class="chat-input" onsubmit="sendMessage(event)">
            <input 
                type="text" 
                class="input-field" 
                id="messageInput" 
                placeholder="Digite sua mensagem..."
                autocomplete="off"
            >
            <button type="submit" class="send-button" id="sendButton">
                ➤
            </button>
        </form>
    </div>

    <!-- ======================================== -->
    <!-- SCRIPT PRINCIPAL - CHATBOT COM CADEIAS DE MARKOV -->
    <!-- ======================================== -->
    <!-- 
    FLUXO COMPLETO DO CHATBOT:
    1. Usuário digita mensagem no input HTML
    2. Formulário chama sendMessage(event)
    3. sendMessage() chama getBotResponse(message)
    4. getBotResponse() usa chatbot.generateResponse() (ALGORITMO DE MARKOV)
    5. Resposta é exibida na interface via addMessage()
    -->
    <script>
        // Elementos HTML necessários para o funcionamento
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const typingIndicator = document.getElementById('typingIndicator');

        // ========================================
        // CÓDIGO PRINCIPAL DO CHATBOT COM CADEIAS DE MARKOV
        // ========================================
        // Esta é a classe principal que implementa o algoritmo de Markov
        // para gerar respostas dinâmicas baseadas em probabilidades de transição entre palavras
        class MarkovChatbot {
            constructor() {
                // Estrutura de dados para armazenar as cadeias de Markov
                this.markovChain = {}; // Dicionário: palavra -> [lista de palavras que podem vir depois]
                this.startWords = [];  // Lista de palavras que podem iniciar uma frase
                
                // DADOS DE TREINAMENTO: Frases em português sobre a UnB
                // O algoritmo aprende padrões de linguagem a partir destas frases
                this.trainingData = [
                    "Olá! Bem-vindo à Universidade de Brasília!",
                    "A UnB é uma das melhores universidades do Brasil.",
                    "Temos diversos cursos de graduação e pós-graduação.",
                    "O campus Darcy Ribeiro é lindo e moderno.",
                    "A biblioteca central tem um acervo incrível.",
                    "Os professores são muito qualificados e dedicados.",
                    "A UnB oferece bolsas de estudo e auxílios.",
                    "O restaurante universitário tem comida boa e barata.",
                    "Existem muitas atividades culturais e esportivas.",
                    "A UnB fica em Brasília, capital do Brasil.",
                    "Temos laboratórios modernos e bem equipados.",
                    "A universidade tem parcerias internacionais importantes.",
                    "O processo seletivo é feito através do ENEM e SISU.",
                    "As inscrições abrem no início do ano letivo.",
                    "O calendário acadêmico está disponível no site oficial.",
                    "Você pode entrar em contato pelo telefone (61) 3107-0100.",
                    "Cada faculdade tem seus próprios canais de atendimento.",
                    "A UnB tem uma história rica e importante.",
                    "Muitos ex-alunos se tornaram profissionais de destaque.",
                    "A pesquisa científica é muito valorizada na UnB.",
                    "Temos programas de intercâmbio com universidades estrangeiras.",
                    "A UnB é pública e gratuita para todos os estudantes.",
                    "O campus tem uma infraestrutura moderna e completa.",
                    "Existem muitas oportunidades de estágio e emprego.",
                    "A UnB valoriza a diversidade e inclusão social.",
                    "Temos um sistema de bibliotecas muito eficiente.",
                    "Os estudantes podem participar de projetos de extensão.",
                    "A universidade oferece apoio psicológico e pedagógico.",
                    "A UnB tem uma forte tradição em pesquisa acadêmica.",
                    "Muitos cursos são reconhecidos nacionalmente.",
                    "A universidade investe constantemente em inovação.",
                    "Temos um corpo docente altamente qualificado.",
                    "A UnB contribui muito para o desenvolvimento do país.",
                    "Existem muitas atividades de lazer e entretenimento.",
                    "A universidade tem uma localização privilegiada em Brasília.",
                    "Os estudantes têm acesso a recursos tecnológicos modernos.",
                    "A UnB promove eventos culturais e científicos regularmente.",
                    "Temos uma comunidade acadêmica muito ativa e engajada.",
                    "A universidade oferece cursos de idiomas gratuitos.",
                    "Existem muitas oportunidades de desenvolvimento pessoal e profissional."
                ];
                // Inicializar a cadeia de Markov com os dados de treinamento
                this.initializeMarkovChain();
            }

            // MÉTODO PRINCIPAL: Constrói a cadeia de Markov a partir dos dados de treinamento
            initializeMarkovChain() {
                // Processar cada frase dos dados de treinamento
                this.trainingData.forEach(text => {
                    const words = this.tokenize(text);
                    if (words.length > 0) {
                        this.startWords.push(words[0]); // Adicionar primeira palavra como possível início
                        this.buildChain(words);         // Construir transições entre palavras
                    }
                });
            }

            // MÉTODO AUXILIAR: Converte texto em array de palavras limpas
            tokenize(text) {
                return text.toLowerCase()
                    .replace(/[^\w\s]/g, '')  // Remove pontuação
                    .split(/\s+/)             // Divide por espaços
                    .filter(word => word.length > 0); // Remove palavras vazias
            }

            // MÉTODO CORE: Constrói as transições da cadeia de Markov
            // Para cada par de palavras consecutivas, registra que a segunda pode vir depois da primeira
            buildChain(words) {
                for (let i = 0; i < words.length - 1; i++) {
                    const currentWord = words[i];
                    const nextWord = words[i + 1];
                    
                    // Se a palavra atual não existe no dicionário, criar array vazio
                    if (!this.markovChain[currentWord]) {
                        this.markovChain[currentWord] = [];
                    }
                    // Adicionar a próxima palavra como possível transição
                    this.markovChain[currentWord].push(nextWord);
                }
            }

            // MÉTODO PRINCIPAL DE GERAÇÃO: Cria resposta usando cadeias de Markov
            generateResponse(input) {
                const inputWords = this.tokenize(input);
                let response = "";
                
                // ESTRATÉGIA 1: Tentar começar com uma palavra da entrada do usuário
                let currentWord = this.findBestStartWord(inputWords);
                
                // ESTRATÉGIA 2: Se não encontrar, usar palavra aleatória do treinamento
                if (!currentWord) {
                    currentWord = this.getRandomStartWord();
                }

                response = currentWord;
                let wordCount = 1;
                const maxWords = 15; // Limite para evitar respostas muito longas

                // ALGORITMO DE MARKOV: Gerar sequência de palavras baseada em probabilidades
                while (wordCount < maxWords && this.markovChain[currentWord]) {
                    const possibleNextWords = this.markovChain[currentWord];
                    // Escolher próxima palavra aleatoriamente (baseado na frequência no treinamento)
                    const nextWord = possibleNextWords[Math.floor(Math.random() * possibleNextWords.length)];
                    
                    if (nextWord) {
                        response += " " + nextWord;
                        currentWord = nextWord; // Atualizar palavra atual para próxima iteração
                        wordCount++;
                    } else {
                        break; // Não há mais palavras possíveis
                    }
                }

                return this.formatResponse(response);
            }

            // MÉTODO AUXILIAR: Encontra melhor palavra de início baseada na entrada
            findBestStartWord(inputWords) {
                for (const word of inputWords) {
                    if (this.markovChain[word]) {
                        return word; // Retorna primeira palavra da entrada que existe no treinamento
                    }
                }
                return null; // Nenhuma palavra da entrada foi encontrada
            }

            // MÉTODO AUXILIAR: Escolhe palavra aleatória para iniciar resposta
            getRandomStartWord() {
                return this.startWords[Math.floor(Math.random() * this.startWords.length)];
            }

            // MÉTODO AUXILIAR: Formata a resposta final (capitalização e pontuação)
            formatResponse(response) {
                // Capitalizar primeira letra e adicionar pontuação
                response = response.charAt(0).toUpperCase() + response.slice(1);
                
                if (!response.endsWith('.') && !response.endsWith('!') && !response.endsWith('?')) {
                    response += '.';
                }
                
                return response;
            }
        }

        // ========================================
        // INSTANCIAÇÃO DO CHATBOT
        // ========================================
        // Criar uma instância do chatbot que será usada em todo o sistema
        const chatbot = new MarkovChatbot();

        // ========================================
        // FUNÇÕES DE INTEGRAÇÃO COM A INTERFACE HTML
        // ========================================
        
        // FUNÇÃO PRINCIPAL: Processa envio de mensagem pelo usuário
        function sendMessage(event) {
            event.preventDefault();
            
            const message = messageInput.value.trim();
            if (!message) return;

            // 1. Adicionar mensagem do usuário na interface
            addMessage(message, 'user');
            messageInput.value = '';
            
            // 2. Mostrar indicador de "digitando..." para simular processamento
            showTyping();
            
            // 3. Gerar resposta usando Markov e exibir após delay
            setTimeout(() => {
                hideTyping();
                const response = getBotResponse(message); // AQUI É ONDE O MARKOV É USADO
                addMessage(response, 'bot');
            }, 1500);
        }

        // FUNÇÃO AUXILIAR: Processa cliques nos botões de ação rápida
        function sendQuickMessage(message) {
            addMessage(message, 'user');
            
            showTyping();
            setTimeout(() => {
                hideTyping();
                const response = getBotResponse(message); // AQUI TAMBÉM USA MARKOV
                addMessage(response, 'bot');
            }, 1200);
        }

        // FUNÇÃO DE INTERFACE: Adiciona mensagem na tela do chat
        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            
            // Criar HTML da mensagem baseado no remetente
            if (sender === 'bot') {
                messageDiv.innerHTML = `
                    <div class="bot-avatar">S</div>
                    <div class="message-bubble">${text}</div>
                `;
            } else {
                messageDiv.innerHTML = `
                    <div class="message-bubble">${text}</div>
                `;
            }
            
            // Remover mensagem de boas-vindas se existir
            const welcomeMessage = chatMessages.querySelector('.welcome-message');
            if (welcomeMessage) {
                welcomeMessage.remove();
            }
            
            // Adicionar mensagem ao chat e rolar para baixo
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // ========================================
        // FUNÇÃO CORE: GERA RESPOSTA USANDO MARKOV + CONTEXTO
        // ========================================
        // Esta é a função que conecta o algoritmo de Markov com a interface
        function getBotResponse(message) {
            // 1. GERAR RESPOSTA USANDO CADEIAS DE MARKOV
            const markovResponse = chatbot.generateResponse(message);
            
            // 2. ADICIONAR CONTEXTO ESPECÍFICO baseado em palavras-chave
            const lowerMessage = message.toLowerCase();
            
            if (lowerMessage.includes('curso') || lowerMessage.includes('graduação')) {
                return `Sobre cursos, ${markovResponse.toLowerCase()} A UnB oferece mais de 100 cursos de graduação e diversos programas de pós-graduação.`;
            } else if (lowerMessage.includes('matrícula') || lowerMessage.includes('inscrição')) {
                return `Para matrícula, ${markovResponse.toLowerCase()} O processo seletivo é feito através do ENEM/SISU ou vestibular.`;
            } else if (lowerMessage.includes('calendário') || lowerMessage.includes('semestre')) {
                return `Sobre o calendário, ${markovResponse.toLowerCase()} O semestre letivo geralmente inicia em março e agosto.`;
            } else if (lowerMessage.includes('contato') || lowerMessage.includes('telefone')) {
                return `Para contato, ${markovResponse.toLowerCase()} Você pode ligar para (61) 3107-0100 ou acessar unb.br.`;
            } else {
                // 3. RETORNAR RESPOSTA PURA DO MARKOV se não houver contexto específico
                return markovResponse;
            }
        }

        // FUNÇÕES AUXILIARES DE INTERFACE
        function showTyping() {
            typingIndicator.style.display = 'flex';
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function hideTyping() {
            typingIndicator.style.display = 'none';
        }

        // ========================================
        // INICIALIZAÇÃO DA PÁGINA
        // ========================================
        // Focar no input quando a página carregar
        window.addEventListener('load', () => {
            messageInput.focus();
        });
    </script>
